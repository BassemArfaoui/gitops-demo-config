apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: gitops.rules
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: "Application {{ $labels.name }} has been Degraded for more than 2 minutes."
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: "Application {{ $labels.name }} has been OutOfSync for more than 2 minutes."
        - alert: PodImagePullBackOff
          expr: kube_pod_container_status_waiting_reason{namespace="demo-dev",reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is stuck in {{ $labels.reason }}"
            description: "A container in {{ $labels.namespace }}/{{ $labels.pod }} has been failing for more than 1 minute."
